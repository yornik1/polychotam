services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: polychotam-app
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    ports:
      - "3000:3000"
    volumes:
      # NDJSON ошибок BullMQ (BULL_JOB_ERRORS_LOG_PATH по умолчанию logs/... от cwd=/app)
      - ./logs:/app/logs
    restart: unless-stopped

  postgres:
    image: postgres:17-alpine
    container_name: polychotam-postgres
    environment:
      POSTGRES_DB: polychotam
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d polychotam"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: polychotam-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
