# Проверки при push/PR. Ветку main при необходимости замени на свою основную.
name: CI

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Установка зависимостей
        run: npm ci

      - name: ESLint
        run: npm run lint

      - name: TypeScript
        run: npm run typecheck

      - name: Тесты
        run: npm run test

      - name: Сборка NestJS
        run: npm run build

  docker-image:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Сборка Docker-образа (как в docker compose)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: polychotam-app:ci
