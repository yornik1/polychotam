# Ручной деплой: GitHub → Actions → «Run workflow».
# На EC2 должен быть клон этого репозитория, Docker, docker compose v2, в каталоге — .env для прода.
name: Deploy EC2 (SSH)

on:
  workflow_dispatch:
    inputs:
      deploy_path:
        description: "Каталог с репозиторием на сервере"
        required: true
        default: "/home/ubuntu/polychotam"
        type: string
      git_ref:
        description: "Ветка или tag (checkout + pull)"
        required: true
        default: "main"
        type: string

# Не запускать два деплоя одновременно
concurrency:
  group: deploy-ec2
  cancel-in-progress: false

jobs:
  deploy:
    name: SSH и docker compose
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Деплой по SSH
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          command_timeout: 40m
          script_stop: true
          script: |
            set -euo pipefail
            cd "${{ inputs.deploy_path }}"
            git fetch --prune origin
            git checkout "${{ inputs.git_ref }}"
            git pull origin "${{ inputs.git_ref }}"
            docker compose -f docker-compose.prod.yml up -d --build
